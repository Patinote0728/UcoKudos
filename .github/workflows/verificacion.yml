name: Verificación automática

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilacion:
    name: Compilar con Java 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ucokudos
          POSTGRES_USER: ucokudos
          POSTGRES_PASSWORD: ucokudos_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ucokudos -d ucokudos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Preparar Java y Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y verificar
        run: mvn -B -f backend/pom.xml verify

  seguridad:
    name: Analizar vulnerabilidades y secretos
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
      - name: Escanear dependencias, secretos y configuración
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '0'
