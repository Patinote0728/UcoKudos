spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ucokudos}
    username: ${DB_USERNAME:ucokudos}
    password: ${DB_PASSWORD:ucokudos_local}
  jpa:
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

ucokudos:
  adjuntos:
    ruta: ${UCOKUDOS_ADJUNTOS_RUTA:./datos/adjuntos}
  demostracion:
    habilitada: ${DEMO_ACCOUNTS_ENABLED:true}
    contrasena: ${DEMO_ACCOUNTS_PASSWORD:CambioLocal123!}

management:
  endpoint:
    health:
      show-details: always

