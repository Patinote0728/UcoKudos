services:
  database:
    image: postgres:16-alpine
    container_name: ucokudos-database
    environment:
      POSTGRES_DB: ucokudos
      POSTGRES_USER: ucokudos
      POSTGRES_PASSWORD: ucokudos_local
    ports:
      - "5433:5432"
    volumes:
      - ucokudos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucokudos -d ucokudos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ucokudos-postgres-data:
